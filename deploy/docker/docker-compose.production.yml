version: "3.8"

networks:
  maijrun-internal:
    driver: bridge
  maijrun-public:
    driver: bridge

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  certbot_etc:
    driver: local
  certbot_var:
    driver: local

services:
  # 1. PostgreSQL Database (Hardened, internal network only)
  postgres:
    image: postgres:15-alpine
    container_name: maijrun-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maijrun_prod}
      POSTGRES_USER: ${POSTGRES_USER:-maijrun_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - maijrun-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maijrun_user} -d ${POSTGRES_DB:-maijrun_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: maijrun-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - maijrun-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Medusa E-Commerce Backend Engine
  backend:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: maijrun-backend
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-maijrun_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maijrun_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ADMIN_CORS: ${ADMIN_CORS:-https://admin.maijrun.com}
      STORE_CORS: ${STORE_CORS:-https://maijrun.com}
      BKASH_APP_KEY: ${BKASH_APP_KEY}
      BKASH_APP_SECRET: ${BKASH_APP_SECRET}
      BKASH_USERNAME: ${BKASH_USERNAME}
      BKASH_PASSWORD: ${BKASH_PASSWORD}
      NAGAD_MERCHANT_ID: ${NAGAD_MERCHANT_ID}
      NAGAD_PUBLIC_KEY: ${NAGAD_PUBLIC_KEY}
      NAGAD_PRIVATE_KEY: ${NAGAD_PRIVATE_KEY}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID}
      SSLCOMMERZ_STORE_PASS: ${SSLCOMMERZ_STORE_PASS}
      STEADFAST_API_KEY: ${STEADFAST_API_KEY}
      STEADFAST_SECRET_KEY: ${STEADFAST_SECRET_KEY}
      PATHAO_CLIENT_ID: ${PATHAO_CLIENT_ID}
      PATHAO_CLIENT_SECRET: ${PATHAO_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maijrun-internal

  # 4. Next.js 15 Storefront & Admin Portal
  storefront:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.storefront
    container_name: maijrun-storefront
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://backend:9000
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://maijrun.com}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
    depends_on:
      - backend
    networks:
      - maijrun-internal

  # 5. Production Nginx Reverse Proxy (SSL Termination + Security Headers + Rate Limiting)
  nginx:
    image: nginx:alpine
    container_name: maijrun-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/www/certbot:ro
    depends_on:
      - storefront
      - backend
    networks:
      - maijrun-internal
      - maijrun-public
